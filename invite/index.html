<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<title>you're invited to QuestiO</title>
<script src="../config.js"></script>
<style>
  :root { --yuzu:#CAFF29; --turq:#19C5C0; --teal:#079B98; --bg:#F5F9FA; --ink:#101719; --muted:#566267; --card:#FFFFFF; --border:#E3EAEC; }
  * { margin:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:480px; margin:0 auto; padding:56px 24px; text-align:center; }
  img.hero { width:130px; height:130px; object-fit:contain; }
  h1 { font-size:clamp(26px,6vw,36px); font-weight:800; margin-top:16px; }
  .handle { color:var(--teal); }
  .tag { color:var(--muted); font-size:17px; margin-top:10px; line-height:1.5; }
  .btn { display:block; margin:14px auto 0; max-width:320px; font-weight:800; font-size:17px; padding:15px 20px; border-radius:999px; text-decoration:none; }
  .btn.primary { background:var(--yuzu); color:var(--ink); margin-top:28px; box-shadow:0 6px 18px rgba(16,23,25,.10); }
  .btn.secondary { border:2px solid var(--turq); color:var(--teal); }
  .hidden { display:none; }
  .hint { margin-top:22px; color:var(--muted); font-size:13px; line-height:1.5; }
</style>
</head>
<body>
<div class="wrap">
  <img class="hero" src="../assets/yuzu-highfive.png" alt="QuestiO buddies">
  <h1><span id="who" class="handle">a buddy</span> invited you.</h1>
  <p class="tag">tiny daily quests, done together. they want you on theirs.</p>
  <a id="open" class="btn secondary" href="#">already have the app? open it</a>
  <a id="get" class="btn primary hidden" href="#">get QuestiO</a>
  <a id="beta" class="btn secondary hidden" href="#">or join the beta</a>
  <p class="hint">once you're in: Friends → search <b id="who2">their @handle</b> → add. they'll get a happy notification.</p>
</div>
<script>
  var q = new URLSearchParams(location.search);
  var u = (q.get("u") || "").replace(/[^a-z0-9_]/gi, "").toLowerCase();
  var cfg = window.QUESTIO || {};
  if (u) {
    document.getElementById("who").textContent = "@" + u;
    document.getElementById("who2").textContent = "@" + u;
  }
  document.getElementById("open").href = (cfg.APP_SCHEME || "questio://") + "friends" + (u ? "?add=" + u : "");
  if (cfg.APP_STORE_URL || cfg.TESTFLIGHT_URL) {
    var get = document.getElementById("get");
    get.href = cfg.APP_STORE_URL || cfg.TESTFLIGHT_URL;
    get.classList.remove("hidden");
    if (cfg.APP_STORE_URL && cfg.TESTFLIGHT_URL) {
      var beta = document.getElementById("beta");
      beta.href = cfg.TESTFLIGHT_URL; beta.classList.remove("hidden");
    }
  }
</script>
</body>
</html>
